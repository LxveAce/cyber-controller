name: Build & Release

# DISPATCH-ONLY, DRAFT-ONLY. This workflow never fires on `release: published` — publishing a draft
# triggers nothing, so the exact bytes that were built, checksummed, scanned, and launch-verified on
# the draft are the bytes the public release ships. (The old `release: published` trigger meant
# publishing REBUILT every asset, silently replacing the verified binaries with fresh, unverified ones.)
#
# Release procedure: push the annotated tag -> create a DRAFT release for it -> dispatch this workflow
# with that tag -> verify the draft's assets (SHA256SUMS + VirusTotal + local launch test) -> publish.
#
# A mandatory `preflight` job verifies the tag exists and that EXACTLY ONE release exists for it and
# it is still a DRAFT; published targets are rejected, including reruns of an old run after the
# release went public (every rerun re-executes preflight). Every other job needs preflight, and the
# aggregation jobs gate on `needs.preflight.result == 'success'` (never bare `always()`), so a failed
# preflight cannot mutate anything.
#
# Asset uploads use `gh release upload` ONLY. It touches assets and nothing else, so it cannot change
# draft status. softprops/action-gh-release is deliberately NOT used here: per its documentation, when
# it reuses an existing draft release and `draft: true` is not repeated on that call, it PUBLISHES the
# draft — one omission mid-build would publish a half-built release. `gh release edit --notes-file`
# (used by the VT script) PATCHes only the fields passed, so it preserves draft status too.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag with an EXISTING DRAFT release to build into (e.g. v2.0.1)"
        required: true
        default: "v2.0.1"

# Serialize runs per tag so two builds of the same tag can never interleave their uploads or have one
# run's checksums cover another run's binaries. `cancel-in-progress: false` lets a running build
# finish; a newly dispatched same-tag run waits (GitHub keeps at most one pending run per group and
# visibly cancels a superseded pending run — it is never silently dropped).
concurrency:
  group: build-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

# Build via build.py (the single source of truth) on every platform so the release binaries
# bundle EVERYTHING the app needs at runtime — the QSS theme, assets, all UI submodules, and
# the firmware profiles. The previous hand-rolled per-job pyinstaller command bundled only
# src/config/profiles and never the QSS, so the shipped GUI crashed silently at launch
# (apply_theme() read a stylesheet that was not in the bundle). build.py keeps CI and local
# builds identical. `submodules: recursive` ensures the deadmans-switch submodule is present.

jobs:
  # ── Gate: tag exists, and exactly one release exists for it and it is still a DRAFT. ──
  # Also validates the tag format (vX.Y.Z[-suffix]) so nothing shell-hostile ever reaches the
  # build steps. Reruns re-execute this, so a run rerun after publishing fails here.
  preflight:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify the tag exists
        # Checked via the git-refs API before checkout so a missing tag fails with a clear message
        # instead of a checkout error.
        run: gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Verify an EXISTING DRAFT release (reject published)
        # GET /releases/tags/{tag} returns only PUBLISHED releases, so the draft must be found by
        # listing all releases; scripts/release_preflight.py does the strict matching (exactly one
        # release for the tag, draft == true). --slurp keeps multi-page output one valid JSON doc.
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" \
            | python scripts/release_preflight.py "$TAG"

  build-windows:
    runs-on: windows-latest
    needs: preflight
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the EXACT tagged source, not the dispatch branch, so the built bytes are the
          # source the tag (and the asset name) claims.
          ref: ${{ inputs.tag }}
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install ".[desktop]"
      - name: Build executable (onefile)
        run: python build.py
      - name: Rename binary
        shell: cmd
        run: |
          move dist\CyberController.exe dist\cyber-controller-%TAG%-windows-x64.exe
      - name: Upload release asset (draft-preserving)
        shell: bash
        run: gh release upload "$TAG" "dist/cyber-controller-$TAG-windows-x64.exe" --clobber
      # ── Installer (registers in Settings > Apps > Installed apps). Best-effort: never block the
      # ── core binary build on an installer hiccup — the checksums job still FAILS the run if the
      # ── installer asset ends up missing, so a gap can't slip through as a green validation.
      # ── NOTE: unsigned — SmartScreen still applies until a code-signing cert is added
      # ── (see docs/WINDOWS-SECURITY.md).
      - name: Build folder build (for installer)
        continue-on-error: true
        run: python build.py --onedir
      - name: Install Inno Setup
        continue-on-error: true
        run: choco install innosetup --no-progress -y
      - name: Build installer
        continue-on-error: true
        shell: pwsh
        run: |
          $ver = $Env:TAG.TrimStart('v')
          # NOTE: ${Env:ProgramFiles(x86)} MUST be brace-wrapped — the '(x86)' in the var name otherwise
          # parses as a call and yields the space-less 'C:\Program Files(x86)\...' path (which does not
          # exist), so ISCC was never found and the installer silently never built (continue-on-error
          # masked it — the installer never shipped in any release before this fix).
          & "${Env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" "installer\cyber-controller.iss"
      - name: Upload installer asset (draft-preserving)
        continue-on-error: true
        shell: bash
        run: gh release upload "$TAG" installer/Output/*.exe --clobber

  build-linux:
    runs-on: ubuntu-latest
    needs: preflight
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the EXACT tagged source, not the dispatch branch.
          ref: ${{ inputs.tag }}
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install ".[desktop]"
      - name: Build executable
        run: python build.py
      - name: Rename binary
        run: |
          mv dist/CyberController "dist/cyber-controller-$TAG-linux-x64"
          chmod +x "dist/cyber-controller-$TAG-linux-x64"
      - name: Upload release asset (draft-preserving)
        run: gh release upload "$TAG" "dist/cyber-controller-$TAG-linux-x64" --clobber

  build-linux-arm:
    runs-on: ubuntu-latest
    needs: preflight
    # ARM/QEMU build is best-effort (slow) — never block the other platforms on it. The checksums
    # job still fails the run if the ARM asset is missing, so validation stays honest.
    continue-on-error: true
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the EXACT tagged source, not the dispatch branch.
          ref: ${{ inputs.tag }}
          submodules: recursive
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build with QEMU
        # Use Debian trixie (Python 3.13, satisfies requires-python>=3.12) and its PREBUILT arm64
        # PyQt5 + cryptography from apt — so PyQt5 is never source-built (the old failure: no aarch64
        # wheel -> sip/qmake build with no qmake). pip only installs pyinstaller + the app itself
        # (--no-deps), so no heavy native build runs under emulation.
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            debian:trixie-slim bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                python3 python3-pip python3-dev python3-tk binutils \
                python3-pyqt5 python3-pyqt5.qtsvg \
                python3-serial python3-requests python3-psutil python3-cryptography \
                libegl1 libxkbcommon0
              pip3 install --break-system-packages pyinstaller
              pip3 install --break-system-packages --no-deps .
              python3 build.py
              mv dist/CyberController dist/cyber-controller-${TAG}-linux-arm64
              chmod +x dist/cyber-controller-${TAG}-linux-arm64
            "
      - name: Upload release asset (draft-preserving)
        run: gh release upload "$TAG" "dist/cyber-controller-$TAG-linux-arm64" --clobber

  build-macos:
    runs-on: macos-latest
    needs: preflight
    # Best-effort (like the ARM job): a macOS-specific build hiccup (e.g. the .ico->.icns icon
    # conversion) must never block the other platforms. The checksums job still fails the run if
    # the macOS asset is missing, so validation stays honest.
    continue-on-error: true
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the EXACT tagged source, not the dispatch branch.
          ref: ${{ inputs.tag }}
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        # Pillow is REQUIRED on macOS: PyInstaller converts the app icon.ico -> .icns via Pillow, and
        # the macos-latest runner image no longer ships it preinstalled (v1.4.0 built when it did).
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          pip install ".[desktop]"
      - name: Build executable
        run: python build.py
      - name: Rename binary
        run: |
          mv dist/CyberController "dist/cyber-controller-$TAG-macos-arm64"
          chmod +x "dist/cyber-controller-$TAG-macos-arm64"
      - name: Upload release asset (draft-preserving)
        run: gh release upload "$TAG" "dist/cyber-controller-$TAG-macos-arm64" --clobber

  # ── Consolidate the five binaries into ONE SHA256SUMS.txt (de-bulked layout — no per-file *.sha256).
  # ── This is also the asset-shape gate: it FAILS unless every one of the five expected binaries is
  # ── attached, so a best-effort platform build that quietly produced nothing cannot yield a green
  # ── validation with a short release. Runs even if a build job failed (to report the true shape),
  # ── but never after a failed preflight and never on cancellation — no bare always().
  checksums:
    runs-on: ubuntu-latest
    needs: [preflight, build-windows, build-linux, build-linux-arm, build-macos]
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Exact tag: the preflight script that validates the release must itself come from the tag.
          ref: ${{ inputs.tag }}
      - name: Re-verify draft status + all five binaries attached
        # Re-checks draft here (not just in preflight) so a release published mid-run stops the
        # pipeline instead of being mutated further.
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" \
            | python scripts/release_preflight.py "$TAG" --require-assets
      - name: Build consolidated SHA256SUMS.txt
        # Download and hash the five EXACT expected names — no glob — so a stray asset can never
        # sneak into the checksum file and a missing one fails loudly.
        run: |
          mkdir dl && cd dl
          for name in $(python ../scripts/release_preflight.py --list-expected "$TAG"); do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name"
          done
          sha256sum cyber-controller-* | sed 's/ \*/  /' > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
      - name: Upload SHA256SUMS.txt (draft-preserving)
        run: gh release upload "$TAG" SHA256SUMS.txt --clobber

  # ── VirusTotal on every release, results posted in the notes. REQUIRES the VT_API_KEY repo secret:
  # ── a missing key FAILS this job, because "no scan ran" must never read as a green release
  # ── validation. The key is only ever passed via env to the scan script — never printed. ──
  virustotal:
    runs-on: ubuntu-latest
    needs: [preflight, checksums]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.checksums.result == 'success' }}
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - name: Require the VT secret
        run: |
          if [ -z "$VT_API_KEY" ]; then
            echo "::error::VT_API_KEY secret not set — the scan cannot run, so release validation FAILS (add it in Settings → Secrets)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          # Exact tag: the scanner script must be the one the tag ships, not the default branch's.
          ref: ${{ inputs.tag }}
      - name: Re-verify draft status + full six-asset shape
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" \
            | python scripts/release_preflight.py "$TAG" --require-assets --require-checksums
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: pip install requests
      - name: Download binaries
        run: |
          mkdir dl && cd dl
          for name in $(python ../scripts/release_preflight.py --list-expected "$TAG"); do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name"
          done
      - name: Scan + post VirusTotal results
        run: python scripts/vt_release_scan.py "$TAG" dl
