name: Build & Release

# DISPATCH-ONLY, DRAFT-ONLY. This workflow never fires on `release: published`, so publishing a
# draft rebuilds nothing — the exact bytes built, checksummed, and scanned on the draft are what
# ships. (The old `release: published` trigger silently REBUILT every asset on publish, replacing
# the verified binaries with fresh, unverified ones.)
#
# Procedure: push the annotated tag -> create ONE DRAFT release for it -> dispatch this workflow
# with that tag -> verify the draft's assets -> confirm no run for the tag is active or queued ->
# publish.
#
# Draft protection is layered, not atomic. `preflight` gates the run on exactly-one-draft. But a
# GitHub "re-run failed jobs" / "re-run this job" REUSES an already-successful preflight WITHOUT
# re-running it, so every asset mutation ALSO re-checks draft status right before it acts:
# scripts/release_upload.sh (all uploads) and vt_release_scan.py (the notes edit, after the scan).
# These checks are best-effort, not transactional — hence the "no active/queued run" step before a
# human publishes. Uploads use `gh release upload` only (asset-only, cannot flip draft status);
# softprops/action-gh-release is avoided because it PUBLISHES a reused draft when `draft: true` is
# omitted on a call.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag with an EXISTING DRAFT release to build into (e.g. v2.0.1)"
        required: true
        default: "v2.0.1"

# Serialize runs per tag so two builds of the same tag can never interleave their uploads.
# `cancel-in-progress: false` lets a running build finish; a newly dispatched same-tag run waits.
concurrency:
  group: build-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

# Every platform builds via build.py (the single source of truth) so the release binaries bundle
# everything the app needs at runtime (QSS theme, assets, UI submodules, firmware profiles) exactly
# as a local build would. `submodules: recursive` pulls in the deadmans-switch submodule.

jobs:
  # Gate: the tag exists, and exactly one release carries it and it is still a DRAFT (published
  # rejected). Also validates the tag format so nothing shell-hostile reaches the build steps.
  preflight:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify the tag exists
        run: gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Verify an EXISTING DRAFT release (reject published)
        # /releases/tags/{tag} returns only PUBLISHED releases, so the draft is found by listing all
        # releases; the script does the strict matching. --slurp keeps multi-page output valid JSON.
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" \
            | python scripts/release_preflight.py "$TAG"

  build-windows:
    runs-on: windows-latest
    needs: preflight
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the EXACT tagged source, so the built bytes match what the tag (and asset name) claims.
          ref: ${{ inputs.tag }}
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install ".[desktop]"
      - name: Build executable (onefile)
        run: python build.py
      - name: Rename binary
        shell: cmd
        run: |
          move dist\CyberController.exe dist\cyber-controller-%TAG%-windows-x64.exe
      - name: Upload release asset (draft-guarded)
        shell: bash
        run: bash scripts/release_upload.sh "$TAG" "dist/cyber-controller-$TAG-windows-x64.exe"
      # Installer (registers in Settings > Apps > Installed apps). REQUIRED asset — no
      # continue-on-error: if the installer can't build, the release must fail rather than fall back
      # to a stale installer left on the draft by an earlier run.
      # NOTE: unsigned — SmartScreen still applies until a code-signing cert is added
      # (see docs/WINDOWS-SECURITY.md).
      - name: Build folder build (for installer)
        run: python build.py --onedir
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $ver = $Env:TAG.TrimStart('v')
          # ${Env:ProgramFiles(x86)} MUST be brace-wrapped — otherwise the '(x86)' parses as a call
          # and yields a nonexistent path, so ISCC is never found.
          & "${Env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" "installer\cyber-controller.iss"
      - name: Upload installer asset (draft-guarded)
        shell: bash
        run: bash scripts/release_upload.sh "$TAG" installer/Output/*.exe

  build-linux:
    # Freeze on the oldest supported x64 host; bundled Python/shared libraries inherit its ABI.
    runs-on: ubuntu-22.04
    needs: preflight
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      QT_API: pyqt5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri libxkbcommon0 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 xvfb xauth
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyelftools
          pip install ".[desktop]"
      - name: Build executable
        run: python build.py
      - name: Verify frozen ABI and native renderer
        run: |
          python scripts/verify_linux_bundle.py dist/CyberController \
            --machine EM_X86_64 --max-glibc 2.35
      - name: Smoke-test the exact frozen UI (no devices or operator state)
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          export XDG_CONFIG_HOME="$HOME/config" XDG_CACHE_HOME="$HOME/cache"
          timeout --kill-after=5s 45s xvfb-run -a dist/CyberController --help
          timeout --kill-after=5s 90s xvfb-run -a env QT_QPA_PLATFORM=xcb \
            dist/CyberController --_smoke-startup
      - name: Rename binary
        run: |
          mv dist/CyberController "dist/cyber-controller-$TAG-linux-x64"
          chmod +x "dist/cyber-controller-$TAG-linux-x64"
      - name: Upload release asset (draft-guarded)
        run: bash scripts/release_upload.sh "$TAG" "dist/cyber-controller-$TAG-linux-x64"

  build-linux-arm:
    # Native ARM permits a real Chromium/X11 smoke test; QEMU + --no-deps previously built
    # successfully without the Flask and native-renderer stack needed to open the application.
    runs-on: ubuntu-24.04-arm
    needs: preflight
    # REQUIRED asset. No continue-on-error: a failure
    # here fails the run instead of letting checksums bless a stale arm64 binary from an earlier run.
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      QT_API: pyqt5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive
      - name: Install native ARM dependencies
        # Use Ubuntu's Python 3.12 and matching prebuilt Qt bindings. A setup-python interpreter
        # cannot safely reuse extension modules compiled for another system Python minor version.
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-dev python3-tk binutils \
            python3-pyqt5 python3-pyqt5.qtsvg python3-pyqt5.qtwebengine python3-qtpy \
            libegl1 libgl1 libgl1-mesa-dri libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 xvfb xauth
          /usr/bin/python3 -m venv --system-site-packages .linux-build-venv
          .linux-build-venv/bin/python -m pip install --upgrade pip
          .linux-build-venv/bin/python -m pip install pyinstaller pyelftools ".[desktop]"
      - name: Build and verify native ARM executable
        run: |
          .linux-build-venv/bin/python build.py
          .linux-build-venv/bin/python scripts/verify_linux_bundle.py dist/CyberController \
            --machine EM_AARCH64 --max-glibc 2.39
      - name: Smoke-test the exact frozen ARM UI (no devices or operator state)
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          export XDG_CONFIG_HOME="$HOME/config" XDG_CACHE_HOME="$HOME/cache"
          timeout --kill-after=5s 45s xvfb-run -a dist/CyberController --help
          timeout --kill-after=5s 90s xvfb-run -a env QT_QPA_PLATFORM=xcb \
            dist/CyberController --_smoke-startup
      - name: Rename binary
        run: |
          mv dist/CyberController "dist/cyber-controller-$TAG-linux-arm64"
          chmod +x "dist/cyber-controller-$TAG-linux-arm64"
      - name: Upload release asset (draft-guarded)
        run: bash scripts/release_upload.sh "$TAG" "dist/cyber-controller-$TAG-linux-arm64"

  build-macos:
    runs-on: macos-latest
    needs: preflight
    # REQUIRED asset. No continue-on-error: a macOS build failure (e.g. the .ico->.icns conversion)
    # must fail the run, not fall back to a stale macOS binary from an earlier run.
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        # Pillow is REQUIRED on macOS: PyInstaller converts icon.ico -> .icns via Pillow, and the
        # macos-latest image no longer ships it preinstalled.
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          pip install ".[desktop]"
      - name: Build executable
        run: python build.py
      - name: Rename binary
        run: |
          mv dist/CyberController "dist/cyber-controller-$TAG-macos-arm64"
          chmod +x "dist/cyber-controller-$TAG-macos-arm64"
      - name: Upload release asset (draft-guarded)
        run: bash scripts/release_upload.sh "$TAG" "dist/cyber-controller-$TAG-macos-arm64"

  # Consolidate the five binaries into ONE SHA256SUMS.txt. Runs only when preflight AND every build
  # job succeeded (default `needs` gating — no `if`, no always()): a build that produced nothing
  # skips this job, so a partial run can never yield a green checksum/asset-shape validation.
  checksums:
    runs-on: ubuntu-latest
    needs: [preflight, build-windows, build-linux, build-linux-arm, build-macos]
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Re-verify draft status + all six assets attached
        # Fresh draft check (a rerun could reach here after publish) plus a name-exact shape check:
        # all five freshly-built binaries AND the installer must be present on the draft.
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" \
            | python scripts/release_preflight.py "$TAG" --require-assets
      - name: Build consolidated SHA256SUMS.txt
        # Download and hash the five EXACT expected names — no glob — so a stray asset can't sneak in
        # and a missing one fails loudly.
        run: |
          mkdir dl && cd dl
          for name in $(python ../scripts/release_preflight.py --list-expected "$TAG"); do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name"
          done
          sha256sum cyber-controller-* | sed 's/ \*/  /' > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
      - name: Upload SHA256SUMS.txt (draft-guarded)
        run: bash scripts/release_upload.sh "$TAG" SHA256SUMS.txt

  # VirusTotal on every release, results posted in the notes. REQUIRES the VT_API_KEY repo secret: a
  # missing key FAILS this job, because "no scan ran" must never read as a green release validation.
  # Runs only when preflight and checksums succeeded (default `needs` gating).
  virustotal:
    runs-on: ubuntu-latest
    needs: [preflight, checksums]
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - name: Require the VT secret
        run: |
          if [ -z "$VT_API_KEY" ]; then
            echo "::error::VT_API_KEY secret not set — the scan cannot run, so release validation FAILS (add it in Settings → Secrets)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Re-verify draft status + full six-asset shape
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" \
            | python scripts/release_preflight.py "$TAG" --require-assets --require-checksums
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: pip install requests
      - name: Download binaries
        run: |
          mkdir dl && cd dl
          for name in $(python ../scripts/release_preflight.py --list-expected "$TAG"); do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name"
          done
      - name: Scan + post VirusTotal results
        run: python scripts/vt_release_scan.py "$TAG" dl
