name: Tests
# Hosted Windows source tests exclude tests/test_*.py files whose text contains `qapp`.
# These exclusions leave Qt GUI coverage outside this job.
# The release workflow separately runs a limited frozen Linux chooser/resource/renderer smoke
# with an inert Reform fixture; it bypasses normal startup, access gates and application routes.
# Native product behavior and final package startup/lifecycle still require separate qualification.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app + test deps
        run: pip install -e ".[full,dev]"
      - name: Run pytest (non-GUI logic; GUI-render layer excluded — see header)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_OPENGL: software
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: |
          ign=$(python -c "import glob; print(' '.join('--ignore='+f.replace(chr(92),'/') for f in glob.glob('tests/test_*.py') if 'qapp' in open(f,encoding='utf-8',errors='ignore').read()))")
          echo "Excluding $(echo $ign | wc -w) GUI (qapp) test files from the hosted runner."
          python -m pytest -rf --tb=short --junit-xml=pytest-report.xml $ign
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: warn

  node-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout (minimal scope, no credential persistence)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24 (explicit no package-manager auto-cache; no dependency install)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Run node:test regression suites (tests/*.test.cjs; built-in runner, no npm)
        shell: bash
        run: >
          node --test
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination=node-test-report.xml
          "tests/*.test.cjs"
      - name: Upload node test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-test-report
          path: node-test-report.xml
          if-no-files-found: warn
          retention-days: 7
