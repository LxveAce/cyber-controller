name: Tests
# The pytest suite (475+ tests: core, web/reform, sensing, red-team, Qt render smokes) ran LOCALLY
# only — lint.yml gated CI on Ruff-F alone, so a test regression could reach a release lint-green.
# This closes that gap.
#
# Runs on windows-latest by design: CC is developed on Windows and ships as a Windows .exe (the primary
# target), and a chunk of the suite encodes Windows behavior — exact error-message text (OSError vs
# Linux FileNotFoundError in flash-argv goldens), native-render pixel metrics, and provision-lock timing.
# Those pass on Windows and fail on a Linux runner purely from platform differences, so Windows is both
# the correct and the more-meaningful runner. (A Linux `--ui web` leg could be added later if the suite
# is made platform-agnostic.) The Windows runner has a desktop context, so PyQt5/QtWebEngine need no xvfb.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app + test deps
        run: pip install -e ".[full,dev]"
      - name: Run pytest
        run: python -m pytest -q
