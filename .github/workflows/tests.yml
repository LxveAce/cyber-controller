name: Tests
# The pytest suite (475+ tests: core, web/reform, sensing, red-team, Qt render smokes) ran LOCALLY
# only — lint.yml gated CI on Ruff-F alone, so a test regression could reach a release lint-green.
# This closes that gap.
#
# Runs on windows-latest by design: CC is developed on Windows and ships as a Windows .exe (the primary
# target), and a chunk of the suite encodes Windows behavior (exact error text, native-render pixel
# metrics, provision-lock timing) that fails on a Linux runner from platform differences alone. The
# Windows runner has a desktop context, so PyQt5 needs no xvfb.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app + test deps
        run: pip install -e ".[full,dev]"
      # A JUnit report uploaded as an artifact — the CI console truncates pytest's -q tail, and a
      # QtWebEngine test can hard-exit the process before the summary prints; the XML captures per-test
      # results either way so failures are always diagnosable.
      - name: Run pytest
        # Force every Qt test to the offscreen platform + software GL. The hosted runner's desktop
        # session lacks a real GPU, so a widget test that hits the GL/render path hard-exits the whole
        # process (~79% in, no summary, no report). Most tests set offscreen themselves; this makes it
        # global so the ones that don't can't crash the runner. safety-net: --maxfail keeps a report.
        env:
          QT_QPA_PLATFORM: offscreen
          QT_OPENGL: software
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: python -m pytest -rf --tb=short --junit-xml=pytest-report.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: warn
