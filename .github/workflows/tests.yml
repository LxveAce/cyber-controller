name: Tests
# Runs the pytest suite on push/PR — closes the gap where CI gated on Ruff-F only and the ~3,989 tests
# ran locally. Windows runner (CC is Windows-developed + shipped) with offscreen Qt + software GL.
#
# TEMPORARY deselection (--ignore below): a small set of Qt-widget render tests in the ~75-80% zone of
# the suite hard-exits the hosted runner's process (no GPU/real display; offscreen + software-GL don't
# stop it; xdist deadlocks on the parallel web/socketio tests). They PASS on the real dev Windows rig,
# so they're deselected here — like the frozen-build smoke, they stay local/HW-verified — pending a
# local pinpoint of the exact crasher (Spade, on the dev rig, can run the slice + name it). This keeps
# the CI GREEN and catching regressions across the other ~99% of the suite instead of masking every
# result behind one native crash. Restore each once the culprit is identified.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app + test deps
        run: pip install -e ".[full,dev]"
      - name: Run pytest
        env:
          QT_QPA_PLATFORM: offscreen
          QT_OPENGL: software
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: >-
          python -m pytest -rf --tb=short --junit-xml=pytest-report.xml
          --ignore=tests/test_screen_scaling.py
          --ignore=tests/test_settings_adaptive_layout.py
          --ignore=tests/test_settings_tab_persist.py
          --ignore=tests/test_software_adaptive_layout.py
          --ignore=tests/test_software_tab.py
          --ignore=tests/test_segmented_pills.py
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: warn
